<!doctype html><html><head><meta charset="utf-8">
<style>
@font-face{font-family:Dela;src:url(fonts/dela400.woff2) format('woff2');font-display:block}
@font-face{font-family:Mono;src:url(fonts/mono700.woff2) format('woff2');font-display:block}
@font-face{font-family:Mincho;src:url(fonts/mincho400.woff2) format('woff2');font-display:block}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:#07080a;overflow:hidden}
.wrap{position:relative;width:100%;height:100%;display:flex;align-items:center;
  background:radial-gradient(120% 140% at 78% 50%, #1b1d22 0%, #0b0c0f 46%, #07080a 100%)}
.art{position:absolute;right:0;top:50%;transform:translateY(-50%);height:100%;
  -webkit-mask-image:linear-gradient(90deg,transparent 0%,rgba(0,0,0,.35) 16%,#000 46%);
          mask-image:linear-gradient(90deg,transparent 0%,rgba(0,0,0,.35) 16%,#000 46%)}
.glow{position:absolute;right:6%;top:50%;transform:translateY(-50%);
  width:52%;height:120%;border-radius:50%;
  background:radial-gradient(closest-side, rgba(214,160,74,.17), transparent 72%)}
.txt{position:relative;z-index:2;padding-left:7.5%;max-width:52%}
h1{font-family:Dela,sans-serif;font-style:italic;color:#fff;line-height:.92;
   letter-spacing:.02em;text-shadow:0 .08em .3em rgba(0,0,0,.85)}
.sub{font-family:Mono,monospace;color:#d6a04a;letter-spacing:.42em;margin-top:.5em}
.rule{height:2px;background:linear-gradient(90deg,#d6a04a,rgba(214,160,74,0));margin:1.1em 0 .9em;width:54%}
.tag{color:#c9cbd0;line-height:1.5}
</style></head><body>
<div class="wrap">
  <div class="glow"></div>
  <img class="art" id="art" src="_hdr-art.png">
  <div class="txt">
    <h1 id="t">The Chess</h1>
    <div class="sub" id="s">GROUNDBREAKING</div>
    <div class="rule"></div>
    <div class="tag" id="g"></div>
  </div>
</div></body></html>
