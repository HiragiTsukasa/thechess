<title>技の吹き出し</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@600&display=swap">
<style>
:root{
  --bg:#0a0c0f; --ink:#efe9dc; --sub:#9aa0a6; --line:#23262b;
  --sq-l:#c9c6bf; --sq-d:#4a4f56; --edge:#1b1e22;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Hiragino Mincho ProN","Yu Mincho",serif;
  -webkit-tap-highlight-color:transparent;overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px))}
#wrap{height:100%;display:flex;flex-direction:column;gap:10px;padding-block:14px;box-sizing:border-box}
header{flex:0 0 auto}
h1{margin:0;font-size:15px;font-weight:400;letter-spacing:.08em}
p.lede{margin:5px 0 0;font-size:11.5px;line-height:1.7;color:var(--sub)}
#stage{flex:1 1 auto;position:relative;display:flex;align-items:center;justify-content:center;min-height:0}
#boardWrap{perspective:760px}
#board{display:grid;grid-template-columns:repeat(8,1fr);
  width:min(86vw,360px);aspect-ratio:1;transform:rotateX(26deg);
  transform-style:preserve-3d;border:6px solid var(--edge);border-radius:3px;
  box-shadow:0 26px 40px -18px #000}
.sq{position:relative;background:var(--sq-d)}
.sq.lt{background:var(--sq-l)}
.sq button{position:absolute;inset:0;border:0;background:none;padding:0;cursor:pointer;
  font-size:min(5.4vw,23px);line-height:1;display:grid;place-items:center;
  color:#f4f1ea;text-shadow:0 2px 3px rgba(0,0,0,.6)}
.sq button.b{color:#15181c;text-shadow:0 1px 2px rgba(255,255,255,.18)}
.sq .mk{position:absolute;inset:14%;border-radius:50%;background:#c9a45c;opacity:.55;display:none;pointer-events:none}
.sq.move .mk{display:block}
.sq.selq::after{content:"";position:absolute;inset:4%;border:2px solid #c9a45c;border-radius:4px;pointer-events:none}
.sq.cand::after{content:"";position:absolute;inset:4%;border:2px solid var(--cc,#ffc070);
  background:color-mix(in srgb,var(--cc,#ffc070) 26%,transparent);border-radius:3px;pointer-events:none}
footer{flex:0 0 auto;font-size:11px;line-height:1.75;color:var(--sub)}
footer b{color:var(--ink);font-weight:400}
kbd{font:600 10px/1 "IBM Plex Mono",monospace;border:1px solid var(--line);
  border-radius:4px;padding:2px 5px;color:var(--ink);background:#15181c}

/* ── ここから下はゲーム本体と同じ吹き出し ── */
#skCall{position:fixed;inset:0;z-index:9;pointer-events:none}
#skCall>svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
#skCall>svg path{transition:stroke-width .2s ease,opacity .22s ease}
#skCall b{position:absolute;white-space:nowrap;display:block;
 padding:5px 10px 6px;border-radius:13px;border:1px solid;background:rgba(9,11,14,.88);
 font-weight:400;line-height:1;transform-origin:center;
 transform:translateY(-50%) scale(var(--s,1));opacity:var(--o,1);
 transition:transform .22s cubic-bezier(.2,.9,.3,1.3),opacity .22s ease,
  background .14s ease,box-shadow .22s ease,border-color .22s ease}
#skCall b u{display:block;text-decoration:none;font-family:"IBM Plex Mono",ui-monospace,monospace;
 font-weight:600;font-size:12px;letter-spacing:.03em}
#skCall b small{display:block;margin-top:3px;font-size:9.5px;color:#9aa0a6;letter-spacing:.02em}
#skCall b.off{background:rgba(9,11,14,.62);padding:5px 10px}
#skCall b.off small{display:none}
#skCall b.act{pointer-events:auto;cursor:pointer}
#skCall b.act::after{content:"";position:absolute;inset:-8px;border-radius:20px}
#skCall b.sel{background:rgba(26,30,36,.96);box-shadow:0 0 0 1px currentColor,0 0 18px -5px currentColor}
</style>

<div id="wrap">
  <header>
    <h1>技の吹き出し</h1>
    <p class="lede">駒を <kbd>1</kbd> タップで普通に移動。<kbd>2</kbd> タップ目でその駒の技が全部出る。さらにタップで次の技へ送り、最後は通常へ戻る。撃てない技は灰色のまま。</p>
  </header>
  <div id="stage"><div id="boardWrap"><div id="board"></div></div></div>
  <footer id="note"></footer>
</div>
<div id="skCall"><svg><path id="skStem" fill="none" stroke="#cfd4da" stroke-width="1.2" opacity="0"></path><circle id="skDot" r="3" fill="#efe9dc" opacity="0"></circle><g id="skLn"></g></svg></div>

<script>
const $=id=>document.getElementById(id);
const GLYPH={K:'♚',Q:'♛',R:'♜',B:'♝',N:'♞',P:'♟'};
const NAME={K:'キング',Q:'クイーン',R:'ルーク',B:'ビショップ',N:'ナイト',P:'ポーン'};
/* ゲーム本体と同じ並び・同じ色・同じ説明文 */
const SKP={P:['En Passant','Promotion'],N:[],Q:[],B:['Sanctuary'],R:['Laser'],K:['Castling','Homecoming']};
const SKHUE={Laser:'#ffc070',Sanctuary:'#8fe0a0',Homecoming:'#8fb8e0',Fork:'#ff7a5c',
  Castling:'#8fb8e0','En Passant':'#b69be0',Promotion:'#f3c86a'};
const SKNOTE={Laser:'動かずに直線上を撃つ',Sanctuary:'近くの味方を回復',
  Homecoming:'自陣最下段へ戻る',Fork:'2体をまとめて攻撃',
  Castling:'王とルークが入れ替わる','En Passant':'横を通ったポーンを取る',
  Promotion:'最奥でクイーンに成る'};
/* Fork は全駒共通。今まとめて狙える時だけ末尾に足す */
const listOf=p=>(SKP[p.t]||[]).concat((p.on||[]).includes('Fork')?['Fork']:[]);

/* 盤の中身。on に入っている技が「今撃てる」技 */
const PIECES=[
 {t:'R',side:'w',sq:'e5',on:['Laser','Fork'],cand:{Laser:['e8','a5'],Fork:['e8','a5']},move:['e6','e7','d5','c5','b5','f5','g5','h5','e4','e3']},
 {t:'B',side:'w',sq:'c4',on:['Sanctuary'],cand:{Sanctuary:['c3','e5']},move:['b5','d5','b3','a2','d3','e2']},
 {t:'K',side:'w',sq:'e1',on:['Castling','Homecoming'],cand:{Castling:['g1'],Homecoming:['a1','b1','c1','d1','f1','g1']},move:['d2','e2','f1','d1']},
 {t:'N',side:'w',sq:'c3',on:['Fork'],cand:{Fork:['e4','b5']},move:['a4','b5','d5','e4','e2','d1','b1','a2']},
 {t:'P',side:'w',sq:'d5',on:['En Passant'],cand:{'En Passant':['c6']},move:['d6']},
 {t:'P',side:'w',sq:'g7',on:['Promotion'],cand:{Promotion:['g8']},move:['g8']},
 {t:'Q',side:'w',sq:'h3',on:[],cand:{},move:['h4','h5','g3','f3','g4','f5']},
 {t:'N',side:'b',sq:'e8'},{t:'R',side:'b',sq:'a5'},{t:'B',side:'b',sq:'f6'},
 {t:'K',side:'b',sq:'g8'},{t:'P',side:'b',sq:'c5'},{t:'P',side:'b',sq:'h7'}
];
const key=(f,r)=>'abcdefgh'[f]+r;
const cells={};
const board=$('board');
for(let r=8;r>=1;r--)for(let f=0;f<8;f++){
  const d=document.createElement('div');
  d.className='sq'+((f+r)%2?' lt':'');
  d.innerHTML='<i class="mk"></i>';
  board.appendChild(d);cells[key(f,r)]=d;}
for(const p of PIECES){
  const b=document.createElement('button');
  b.type='button';b.textContent=GLYPH[p.t];
  if(p.side==='b')b.className='b';
  b.setAttribute('aria-label',NAME[p.t]);
  b.addEventListener('click',e=>{e.stopPropagation();onPiece(p);});
  cells[p.sq].appendChild(b);p.el=b;}

let sel=null,cur=null,skItems=[],skTm=[];
function clearBoard(){for(const k in cells)cells[k].classList.remove('move','selq','cand');}
function paintMoves(p){clearBoard();cells[p.sq].classList.add('selq');
  (p.move||[]).forEach(s=>cells[s]&&cells[s].classList.add('move'));}
function paintCands(p,n){clearBoard();cells[p.sq].classList.add('selq');
  ((p.cand||{})[n]||[]).forEach(s=>{if(!cells[s])return;
    cells[s].classList.add('cand');cells[s].style.setProperty('--cc',SKHUE[n]);});}
function note(txt){$('note').innerHTML=txt;}

function onPiece(p){
  if(p.side==='b'){deselect();note('相手の駒。');return;}
  if(sel!==p){deselect();sel=p;cur=null;paintMoves(p);
    note('<b>'+NAME[p.t]+'</b> を選択。ここまでは普通の移動と攻撃。もう一度タップすると技が出る。');return;}
  if(!skItems.length){
    if(!listOf(p).length){note('<b>'+NAME[p.t]+'</b> は自分から撃つ技を持たない。札は出ない。');return;}
    pick(firstOn(p),true);skOpen(p);return;}
  const cyc=skItems.filter(it=>it.ok).map(it=>it.n).concat([null]);
  if(cyc.length<2)return;
  pick(cyc[(cyc.indexOf(cur)+1)%cyc.length],true);
}
const firstOn=p=>listOf(p).find(n=>(p.on||[]).includes(n))||null;
function deselect(){sel=null;cur=null;clearBoard();skHide();}
document.addEventListener('click',()=>{deselect();note('');});

function skHide(){skTm.forEach(clearTimeout);skTm=[];skItems=[];
  [...document.querySelectorAll('#skCall b')].forEach(b=>b.remove());
  $('skLn').innerHTML='';$('skStem').style.opacity='0';$('skDot').style.opacity='0';}
function skOpen(p){skHide();const names=listOf(p);const on=new Set(p.on||[]);
  const g=$('skLn');
  skItems=names.map(n=>{const ok=on.has(n);
    const b=document.createElement('b');b.className=ok?'act':'off';
    b.style.borderColor=ok?SKHUE[n]+'99':'rgba(255,255,255,.14)';
    b.style.color=ok?SKHUE[n]:'#a6abb1';
    b.innerHTML='<u></u><small></small>';
    b.firstChild.textContent=n;b.lastChild.textContent=SKNOTE[n];
    b.style.setProperty('--s','.78');b.style.setProperty('--o','0');
    if(cur===n)b.classList.add('sel');
    if(ok)b.addEventListener('click',e=>{e.stopPropagation();pick(n);});
    $('skCall').appendChild(b);
    const ln=document.createElementNS('http://www.w3.org/2000/svg','path');
    ln.setAttribute('fill','none');
    ln.setAttribute('stroke',ok?SKHUE[n]:'rgba(255,255,255,.2)');
    ln.setAttribute('stroke-width',ok?'1.5':'1');ln.style.opacity='0';g.appendChild(ln);
    return {n,ok,b,ln};});
  frame();
  $('skStem').style.opacity='.5';$('skDot').style.opacity='.85';
  skItems.forEach((it,i)=>skTm.push(setTimeout(()=>{
    it.b.style.setProperty('--o','1');it.b.style.setProperty('--s',cur===it.n?'1.07':'1');
    it.ln.style.opacity=it.ok?(cur===it.n?'1':'.5'):'.4';},40+i*60)));
  if(!(p.on||[]).length)note('<b>'+NAME[p.t]+'</b> の技は <b>'+listOf(p).join('・')+'</b>。今は条件を満たしていないので灰色のまま。');
}
function mark(){for(const it of skItems){const on=cur===it.n;
  it.b.classList.toggle('sel',on);
  it.ln.setAttribute('stroke-width',on?'2.2':it.ok?'1.5':'1');
  it.ln.style.opacity=on?'1':(it.ok?'.5':'.4');
  if(on){it.b.style.setProperty('--s','1.18');
    skTm.push(setTimeout(()=>it.b.style.setProperty('--s','1.07'),150));}
  else it.b.style.setProperty('--s','1');}}
function pick(n,cycled){const p=sel;if(!p)return;
  if(!cycled&&cur===n)n=null;
  cur=n;
  if(n){paintCands(p,n);note('<b>'+n+'</b>：'+SKNOTE[n]+'。色の付いたマスがその技の対象。');}
  else{paintMoves(p);note('通常の移動と攻撃に戻した。札は並んだまま、選択だけ外れる。');}
  mark();}

function frame(){if(!sel||!skItems.length)return;
  const rect=sel.el.getBoundingClientRect();
  const ax=rect.left+rect.width/2, ay=rect.top+rect.height/2;
  const W=innerWidth,H=innerHeight,PAD=8;
  const hs=skItems.map(it=>it.b.offsetHeight||26);
  const tot=hs.reduce((x,y)=>x+y,0)+PAD*(hs.length-1);
  const wide=Math.max(...skItems.map(it=>it.b.offsetWidth||110));
  const right=ax<W*.5;
  const colX=right?Math.min(W-12-wide,ax+92):Math.max(12+wide,ax-92);
  const lo=12+tot/2,hi=H-12-tot/2;
  let mid=ay-14;if(lo<hi)mid=Math.max(lo,Math.min(hi,mid));else mid=(lo+hi)/2;
  const hubX=right?ax+26:ax-26;
  $('skStem').setAttribute('d','M'+ax.toFixed(1)+' '+ay.toFixed(1)+'L'+hubX.toFixed(1)+' '+ay.toFixed(1));
  $('skDot').setAttribute('cx',ax.toFixed(1));$('skDot').setAttribute('cy',ay.toFixed(1));
  let y=mid-tot/2;
  skItems.forEach((it,i)=>{const cy=y+hs[i]/2,ex=right?colX-11:colX+11;
    it.b.style.top=cy+'px';
    if(right){it.b.style.left=colX+'px';it.b.style.right='auto';}
    else{it.b.style.right=(W-colX)+'px';it.b.style.left='auto';}
    it.ln.setAttribute('d','M'+hubX.toFixed(1)+' '+ay.toFixed(1)+'L'+ex.toFixed(1)+' '+cy.toFixed(1)
      +'L'+colX.toFixed(1)+' '+cy.toFixed(1));
    y+=hs[i]+PAD;});}
addEventListener('resize',frame);
note('白い駒をタップしてみて。Fork は全駒共通なので、今まとめて狙える駒にだけ並ぶ。h3 のクイーンのように自分から撃つ技を持たない駒には札が出ない。');
</script>
