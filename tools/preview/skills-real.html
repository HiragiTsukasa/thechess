<title>技の吹き出し 実機</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
:root{--bg:#07080a;--ink:#e9eaec;--sub:#9aa0a6;--line:#23262b;color-scheme:dark}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);overflow:hidden;
 font:13px/1.5 -apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;
 -webkit-tap-highlight-color:transparent}
#stage{position:fixed;left:0;right:0;top:0;bottom:var(--bar,52px);
 border:0;width:100%;height:calc(100% - var(--bar,52px));background:var(--bg);display:block}
#bar{position:fixed;left:0;right:0;bottom:0;height:var(--bar,52px);
 display:flex;align-items:center;gap:8px;overflow-x:auto;scrollbar-width:none;
 padding:0 max(12px,env(safe-area-inset-left,0px)) env(safe-area-inset-bottom,0px) max(12px,env(safe-area-inset-right,0px));
 box-sizing:content-box;background:#0d0f12;border-top:1px solid var(--line)}
#bar button{flex:0 0 auto;border:1px solid var(--line);background:#15181c;color:var(--ink);
 border-radius:999px;padding:7px 13px;font:inherit;font-size:12px;cursor:pointer}
#bar button:active{background:#1e2228}
#bar button.on{background:#2a3038;border-color:#4a525c;color:#fff}
#bar .grp{flex:0 0 auto;display:flex;align-items:center;gap:6px;
 padding-left:10px;margin-left:2px;border-left:1px solid var(--line)}
#bar .grp span{font-size:10px;color:var(--sub);white-space:nowrap}
#bar .grp button{padding:6px 10px;font-size:11px}
#msg{flex:1 1 auto;min-width:0;color:var(--sub);font-size:11px;
 overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
</style>
<iframe id="stage" src="game.html" allow="autoplay; fullscreen" title="The Chess: Groundbreaking"></iframe>
<div id="bar">
  <button type="button" data-pos="Q">クイーン</button>
  <button type="button" data-pos="R">ルーク</button>
  <button type="button" data-pos="B">ビショップ</button>
  <button type="button" data-pos="N">ナイト</button>
  <button type="button" data-pos="P">ポーン</button>
  <span class="grp"><span>キルカメラ</span>
    <button type="button" data-mt="23">全部ランダム</button>
    <button type="button" data-mt="22">リプレイ</button>
    <button type="button" data-mt="21">多視点</button>
    <button type="button" data-mt="20">1種ランダム</button></span>
  <span class="grp"><span>構えを固定</span>
    <button type="button" data-mt="0">攻め手の肩越し</button><button type="button" data-mt="1">王の正面ロー</button>
    <button type="button" data-mt="2">真横すれすれ</button><button type="button" data-mt="3">見下ろし</button>
    <button type="button" data-mt="4">王の肩越し</button>
    <button type="button" data-mt="5">足元の広角</button><button type="button" data-mt="6">真俯瞰</button>
    <button type="button" data-mt="7">望遠の圧縮</button><button type="button" data-mt="8">傾いた肩越し</button>
    <button type="button" data-mt="9">攻め手の真上</button></span>
  <span id="msg">読み込み中…</span>
</div>
<script>
try{localStorage.setItem('nc_tut1','1');localStorage.setItem('nc_tut2','1');}catch(e){}
const W=(t,s,o)=>o?['w',t,s,o]:['w',t,s], B=(t,s,o)=>o?['b',t,s,o]:['b',t,s];
/* 討ち取る駒ごとのチェックメイト盤面。どれも白番、1手で決まる */
const BOARDS={
 Q:{name:'クイーン',from:'h1',to:'a8',
    pos:[W('K','e1'),W('Q','h1'),W('R','d1'),W('P','b2'),W('P','h2'),W('P','e2'),
         B('K','a8',{hp:60}),B('P','a7'),B('P','c7'),B('N','f6'),B('P','g7')],
    tip:'h1のクイーンが長い対角線を一気に詰める。'},
 R:{name:'ルーク',from:'d8',to:'h8',
    pos:[W('K','e1'),W('R','d8'),W('P','a2'),W('P','b2'),W('P','c2'),
         B('K','h8',{hp:60}),B('P','g7'),B('P','h7'),B('N','c6'),B('P','a7')],
    tip:'最下段を横に走る Back Rank Mate。'},
 B:{name:'ビショップ',from:'c3',to:'h8',
    pos:[W('K','e1'),W('B','c3'),W('P','a2'),W('P','b2'),W('P','h2'),
         B('K','h8',{hp:60}),B('P','h7'),B('P','f7'),B('R','a8'),B('N','b8')],
    tip:'c3のビショップが対角線を抜く。'},
 N:{name:'ナイト',from:'f7',to:'h8',
    pos:[W('K','e1'),W('N','f7'),W('Q','d1'),W('P','a2'),W('P','h2'),
         B('K','h8',{hp:60}),B('R','g8'),B('P','g7'),B('P','h7')],
    tip:'味方に囲まれた王をナイトが討つ Smothered Mate。'},
 P:{name:'ポーン',from:'b7',to:'a8',
    pos:[W('K','e1'),W('P','b7'),W('R','d1'),W('P','a2'),W('P','h2'),
         B('K','a8',{hp:5}),B('P','c7'),B('N','f6'),B('P','g7')],
    tip:'成る直前のポーンが王を討つ。'}};
const msg=document.getElementById('msg');
let G=null,cur=null;
function waitG(cb){const f=document.getElementById('stage');let n=0;
  const t=setInterval(()=>{let g=null;
    try{g=f.contentWindow&&f.contentWindow.__G;}catch(e){}
    if(g&&g.setPos){clearInterval(t);G=g;cb(g);}
    else if(++n>400){clearInterval(t);msg.textContent='ゲームの読み込みに失敗した。再読み込みしてみて。';}},150);}
function load(k){const d=BOARDS[k];if(!G){msg.textContent='読み込み中…';return;}
  try{G.setPos(d.pos,'w');cur=k;
    msg.textContent=d.tip+' '+d.from+'をタップ→'+d.to+'をタップ→もう一度タップで決まる。';
    [...document.querySelectorAll('#bar button[data-pos]')]
      .forEach(b=>b.classList.toggle('on',b.getAttribute('data-pos')===k));}
  catch(e){msg.textContent='盤面を置けなかった：'+e.message;}}
[...document.querySelectorAll('#bar button[data-pos]')]
  .forEach(b=>b.addEventListener('click',()=>load(b.getAttribute('data-pos'))));
const MTN=['攻め手の肩越し','王の正面ロー','真横すれすれ','見下ろし','王の肩越し',
  '足元の広角','真俯瞰','望遠の圧縮','傾いた肩越し','攻め手の真上'];
const mtBs=[...document.querySelectorAll('#bar button[data-mt]')];
const paintMt=v=>mtBs.forEach(b=>b.classList.toggle('on',+b.getAttribute('data-mt')===v));
mtBs.forEach(b=>b.addEventListener('click',()=>{const v=+b.getAttribute('data-mt');
  if(!G){msg.textContent='読み込み中…';return;}
  G.mateSet(v);paintMt(v);
  msg.textContent=v===23?'リプレイ／3カット／1種固定を、決めるたびに引く。構えも10種から。':
    v===22?'決める直前を、別の視点から2回見直す。':
    v===21?'決めの瞬間を3つの角度から続けて見せる。':
    v===20?'決めのカメラを10種から毎回ランダムで選ぶ。':'決めのカメラ：'+MTN[v]+'。';}));
waitG(()=>{load('Q');try{paintMt(G.mate());}catch(e){}});
</script>
