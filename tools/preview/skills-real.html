<title>技の吹き出し 実機</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
:root{--bg:#07080a;--ink:#e9eaec;--sub:#9aa0a6;--line:#23262b;color-scheme:dark}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);overflow:hidden;
 font:13px/1.5 -apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;
 -webkit-tap-highlight-color:transparent}
#stage{position:fixed;left:0;right:0;top:0;bottom:var(--bar,52px);
 border:0;width:100%;height:calc(100% - var(--bar,52px));background:var(--bg);display:block}
#bar{position:fixed;left:0;right:0;bottom:0;height:var(--bar,52px);
 display:flex;align-items:center;gap:8px;overflow-x:auto;scrollbar-width:none;
 padding:0 max(12px,env(safe-area-inset-left,0px)) env(safe-area-inset-bottom,0px) max(12px,env(safe-area-inset-right,0px));
 box-sizing:content-box;background:#0d0f12;border-top:1px solid var(--line)}
#bar button{flex:0 0 auto;border:1px solid var(--line);background:#15181c;color:var(--ink);
 border-radius:999px;padding:7px 13px;font:inherit;font-size:12px;cursor:pointer}
#bar button:active{background:#1e2228}
#bar button.on{background:#2a3038;border-color:#4a525c;color:#fff}
#bar .grp{flex:0 0 auto;display:flex;align-items:center;gap:6px;
 padding-left:10px;margin-left:2px;border-left:1px solid var(--line)}
#bar .grp span{font-size:10px;color:var(--sub);white-space:nowrap}
#bar .grp button{padding:6px 10px;font-size:11px}
#msg{flex:1 1 auto;min-width:0;color:var(--sub);font-size:11px;
 overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
</style>
<iframe id="stage" src="game.html" allow="autoplay; fullscreen" title="The Chess: Groundbreaking"></iframe>
<div id="bar">
  <button type="button" id="bD">フォーク</button>
  <button type="button" id="bE">遠距離オーバーキル</button>
  <button type="button" id="bF">チェックメイト</button>
  <span class="grp"><span>フォーク経路</span>
    <button type="button" data-fk="0">戻る</button><button type="button" data-fk="1">三角</button></span>
  <span class="grp"><span>遠距離カメラ</span>
    <button type="button" data-ok="9">ランダム</button>
    <button type="button" data-ok="0">追従</button><button type="button" data-ok="1">肩越し即</button>
    <button type="button" data-ok="2">途中</button><button type="button" data-ok="3">真横</button></span>
  <span class="grp"><span>キルカメラ</span>
    <button type="button" data-mt="8">多視点</button>
    <button type="button" data-mt="9">1種ランダム</button>
    <button type="button" data-mt="0">攻め手の肩越し</button><button type="button" data-mt="1">王の正面ロー</button>
    <button type="button" data-mt="2">真横すれすれ</button><button type="button" data-mt="3">見下ろし</button>
    <button type="button" data-mt="4">王の肩越し</button></span>
  <span class="grp"><span>肩越し 振り角</span>
    <button type="button" data-ang="25">25°</button><button type="button" data-ang="45">45°</button>
    <button type="button" data-ang="60">60°</button><button type="button" data-ang="80">80°</button></span>
  <span class="grp"><span>高さ</span>
    <button type="button" data-shy="0.45">低</button><button type="button" data-shy="1">中</button>
    <button type="button" data-shy="2.1">高</button></span>
  <span class="grp"><span>引き</span>
    <button type="button" data-shr="0.75">寄り</button><button type="button" data-shr="1">標準</button>
    <button type="button" data-shr="1.5">引き</button></span>
  <span id="msg">読み込み中…</span>
</div>
<script>
try{localStorage.setItem('nc_tut1','1');localStorage.setItem('nc_tut2','1');}catch(e){}
const W=(t,s)=>['w',t,s], B=(t,s)=>['b',t,s];
/* d5 のクイーンが5体を狙える。どの2体にするか選ぶ盤面 */
const POS_D=[W('K','g1'),W('Q','d5'),W('P','a2'),W('P','g2'),W('P','h2'),
  B('K','g8'),B('R','d8'),B('N','b5'),B('B','g5'),B('P','d7'),B('P','a8'),B('P','h7')];
/* h1 のクイーンが a8 の瀕死ビショップを7マス先から撃つ。追従カメラが置いていかれる距離 */
const POS_E=[W('K','e1'),W('Q','h1'),W('P','b2'),W('P','h2'),W('P','e2'),
  B('K','g8'),['b','B','a8',{hp:40}],B('P','g7'),B('P','h7'),B('N','f6')];
/* h1 のクイーンが a8 の瀕死キングを討つ。チェックメイトの決め演出 */
const POS_F=[W('K','e1'),W('Q','h1'),W('R','d1'),W('P','b2'),W('P','h2'),W('P','e2'),
  ['b','K','a8',{hp:60}],B('P','a7'),B('P','c7'),B('N','f6'),B('P','g7')];
const msg=document.getElementById('msg');
let G=null;
function waitG(cb){const f=document.getElementById('stage');let n=0;
  const t=setInterval(()=>{let g=null;
    try{g=f.contentWindow&&f.contentWindow.__G;}catch(e){}
    if(g&&g.setPos){clearInterval(t);G=g;cb(g);}
    else if(++n>400){clearInterval(t);msg.textContent='ゲームの読み込みに失敗した。再読み込みしてみて。';}},150);}
function load(pos,label,ep){if(!G){msg.textContent='読み込み中…';return;}
  try{G.setPos(pos,'w',ep);msg.textContent=label;}catch(e){msg.textContent='盤面を置けなかった：'+e.message;}}
document.getElementById('bD').addEventListener('click',()=>load(POS_D,
  'd5クイーンをタップ→Forkを選ぶ→狙える5体から2体をタップで決める。もう一度タップで実行。'));
document.getElementById('bE').addEventListener('click',()=>load(POS_E,
  'h1クイーンをタップ→a8をタップ→もう一度タップで発動。右のカメラ切替で見え方を比べられる。'));
/* 切替スイッチ。盤面を置き直さずにその場で効く */
function seg(attr,fn){const bs=[...document.querySelectorAll('#bar button['+attr+']')];
  const paint=v=>bs.forEach(b=>b.classList.toggle('on',Math.abs(+b.getAttribute(attr)-v)<1e-6));
  bs.forEach(b=>b.addEventListener('click',()=>{const v=+b.getAttribute(attr);
    if(!G){msg.textContent='読み込み中…';return;}fn(v);paint(v);}));
  return paint;}
const paintFk=seg('data-fk',v=>{G.fkSet(v);
  msg.textContent=v?'フォークは1撃目の位置から2撃目へ向かう（三角形）。':'フォークは毎回自分のマスへ戻る。';});
const paintOk=seg('data-ok',v=>{G.okCamSet(v,3.4);
  msg.textContent=['遠距離も追従カメラのまま。','点火した瞬間に相手の肩越しへ切り替える。',
    '少し追ってから、飛行の途中で相手の肩越しへ。','真横から引いて、飛んでいく全体を見せる。'][v];});
document.getElementById('bF').addEventListener('click',()=>load(POS_F,
  'h1クイーンをタップ→a8をタップ→もう一度タップでチェックメイト。キルカメラを切り替えて比べられる。'));
const MTN=['攻め手の肩越し','王の正面ロー','真横すれすれ','見下ろし','王の肩越し'];
const paintMt=seg('data-mt',v=>{G.mateSet(v);
  msg.textContent=v===8?'決めの瞬間を3つの角度から続けて見せる。':
    v===9?'決めのカメラを5種から毎回ランダムで選ぶ。':'決めのカメラ：'+MTN[v]+'。';});
const paintAng=seg('data-ang',v=>{G.shSet(v,null,null);msg.textContent='肩越しの振り角 '+v+'°。射線の真後ろが0°、真横が90°。';});
const paintShy=seg('data-shy',v=>{G.shSet(null,v,null);msg.textContent='肩越しの高さ '+v+'。';});
const paintShr=seg('data-shr',v=>{G.shSet(null,null,v);msg.textContent='肩越しの引き ×'+v+'。';});
waitG(()=>{load(POS_D,'d5クイーンをタップ→Forkを選ぶ→狙える5体から2体を決めて発動。');
  try{paintFk(G.fk());paintOk(G.okCam()[0]);
    const sh=G.sh();paintAng(sh[0]);paintShy(sh[1]);paintShr(sh[2]);paintMt(G.mate());}catch(e){}});
</script>
